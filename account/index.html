<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account — Sarx</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://sarx.app/account/">
  <meta name="description" content="Manage your Sarx account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"></noscript>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="screen active">

    <div class="topic-nav">
      <a href="javascript:history.back()" class="topic-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </a>
      <span class="topic-nav-spacer"></span>
    </div>

    <p class="section-tag">SARX</p>
    <h1 class="screen-title" style="margin-bottom: 24px;">Account</h1>

    <div class="account-body">

      <div class="account-card">
        <p class="account-card-label">SIGNED IN AS</p>
        <p class="account-email" id="accountEmail">—</p>
      </div>

      <div class="account-card">
        <p class="account-card-label">DISPLAY NAME</p>
        <div class="input-row">
          <input class="field-input" type="text" id="displayNameInput" placeholder="Add a name" maxlength="60">
        </div>
        <button class="primary-btn" style="margin-top: 14px;" onclick="saveDisplayName()">SAVE</button>
        <p id="accountSaveNotice" class="account-notice"></p>
      </div>

      <div class="account-card">
        <p class="account-card-label">MEMBER SINCE</p>
        <p class="account-meta" id="memberSince">—</p>
      </div>

      <button class="signout-btn" type="button" onclick="signOutOfAccount()">SIGN OUT</button>

    </div>

  </div>

  <nav class="tab-bar">
    <a class="tab-item" href="../healthindex/">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
        <rect x="3" y="13" width="4" height="8" rx="1"/>
        <rect x="10" y="8" width="4" height="13" rx="1"/>
        <rect x="17" y="3" width="4" height="18" rx="1"/>
      </svg>
      <span>Index</span>
    </a>
    <a class="tab-item" href="../plan/">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
        <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/>
      </svg>
      <span>Plan</span>
    </a>
    <a class="tab-item" href="../learning/">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
        <path d="M12 3 4 7v13l8-4 8 4V7L12 3zm6 17-6-3-6 3V8.5l6-3 6 3V20z"/>
      </svg>
      <span>Learn</span>
    </a>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="account.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
