<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In — Sarx</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://sarx.app/auth/">
  <meta name="description" content="Sign in to Sarx to sync your health data across devices, or continue without an account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"></noscript>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="screen active">
    <div class="auth-hero">
      <img class="logo-img auth-logo" src="../assets/logo.png" alt="Sarx" width="682" height="177">
      <p class="auth-tagline">Know your body.</p>
      <p class="auth-welcome-desc">Free BMI, TDEE, and body fat calculator, plus custom cutting and bulking plans.</p>
    </div>

    <form class="form-body auth-form" id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="field-group">
        <div class="input-row float-input-row">
          <input class="field-input float-input" type="email" id="authEmail" placeholder=" " autocomplete="email" required>
          <label class="float-label">Email</label>
        </div>
      </div>
      <div class="field-group">
        <div class="input-row float-input-row">
          <input class="field-input float-input" type="password" id="authPassword" placeholder=" " minlength="6" autocomplete="current-password" required>
          <label class="float-label">Password</label>
        </div>
      </div>
      <div class="field-group" id="confirmPasswordGroup" style="display: none;">
        <div class="input-row float-input-row">
          <input class="field-input float-input" type="password" id="authConfirmPassword" placeholder=" " minlength="6" autocomplete="new-password">
          <label class="float-label">Confirm Password</label>
        </div>
      </div>
      <p id="authError" class="form-error"></p>
      <p id="authNotice" class="auth-notice"></p>
      <button class="primary-btn" type="submit" id="authSubmitBtn">LOG IN</button>
    </form>

    <a href="javascript:void(0)" class="auth-guest-link" onclick="continueAsGuest()">Continue without an account</a>

    <div class="auth-divider"><span>or</span></div>

    <button class="oauth-btn" type="button" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <button class="oauth-btn" type="button" id="authToggleBtn" onclick="toggleAuthMode()">Create New Account</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/profileStore.js"></script>
<script src="auth.js"></script>
</body>
</html>
